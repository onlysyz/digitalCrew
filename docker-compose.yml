version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - digitalcrew-data:/app/data
      - digitalcrew-config:/app/config
      - ${HOME}/DigitalCrew/workspace:/app/workspace
      - ${HOME}/DigitalCrew/knowledge:/app/knowledge
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - sandbox
    networks:
      - digitalcrew

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - VITE_API_URL=http://backend:7700/api/v1
    depends_on:
      - backend
    networks:
      - digitalcrew

  sandbox:
    image: python:3.11-slim
    privileged: false
    network_mode: "none"
    volumes:
      - ${HOME}/DigitalCrew/workspace:/workspace:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - digitalcrew

volumes:
  digitalcrew-data:
  digitalcrew-config:

networks:
  digitalcrew:
    driver: bridge